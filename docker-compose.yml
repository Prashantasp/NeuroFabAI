# Local development infrastructure for NeuroFab AI.
#
# Starts the three stateful services the backend depends on. The API and the
# frontend run on the host so that reload-on-save works.

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurofab_postgres
    environment:
      POSTGRES_USER: neurofab
      POSTGRES_PASSWORD: neurofab_password
      POSTGRES_DB: neurofab_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `alembic upgrade head` fails confusingly if Postgres is still starting.
      test: ["CMD-SHELL", "pg_isready -U neurofab -d neurofab_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: neurofab_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neurofab_neo4j
    environment:
      NEO4J_AUTH: neo4j/neurofab_password
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
